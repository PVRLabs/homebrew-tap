name: update Homebrew formula

on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula to update
        required: true
        type: choice
        options:
          - badger
          - statlite
      version:
        description: Exact release version (for example, v0.5.5)
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    name: update ${{ inputs.formula }} formula
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate release checksums
        id: checksums
        env:
          FORMULA: ${{ inputs.formula }}
          RELEASE_VERSION: ${{ inputs.version }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -eu

          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "formula update must be dispatched from main (got $DISPATCH_REF)" >&2
            exit 1
          fi

          if ! printf '%s\n' "$RELEASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version must match vX.Y.Z: $RELEASE_VERSION" >&2
            exit 1
          fi

          case "$FORMULA" in
            badger)
              repository="PVRLabs/aibadger"
              artifact_prefix="badger"
              ;;
            statlite)
              repository="PVRLabs/statlite"
              artifact_prefix="statlite"
              ;;
            *)
              echo "unsupported formula: $FORMULA" >&2
              exit 1
              ;;
          esac

          plain_version="${RELEASE_VERSION#v}"
          base_url="https://github.com/${repository}/releases/download/${RELEASE_VERSION}"

          checksum_for() {
            archive="$1"
            checksum_file="$(curl --fail --silent --show-error --location \
              "${base_url}/${archive}.sha256")"
            checksum_name="$(printf '%s\n' "$checksum_file" | awk 'NF >= 2 { print $2; exit }')"
            checksum="$(printf '%s\n' "$checksum_file" | awk 'NF >= 1 { print $1; exit }')"

            if [ "$checksum_name" != "$archive" ]; then
              echo "checksum file names '$checksum_name', expected '$archive'" >&2
              exit 1
            fi
            if ! printf '%s\n' "$checksum" | grep -Eq '^[0-9a-fA-F]{64}$'; then
              echo "invalid SHA-256 for $archive" >&2
              exit 1
            fi
            printf '%s' "$checksum"
          }

          darwin_arm64="$(checksum_for "${artifact_prefix}_${plain_version}_darwin_arm64.tar.gz")"
          darwin_amd64="$(checksum_for "${artifact_prefix}_${plain_version}_darwin_amd64.tar.gz")"
          linux_arm64="$(checksum_for "${artifact_prefix}_${plain_version}_linux_arm64.tar.gz")"
          linux_amd64="$(checksum_for "${artifact_prefix}_${plain_version}_linux_amd64.tar.gz")"

          {
            echo "darwin_arm64=$darwin_arm64"
            echo "darwin_amd64=$darwin_amd64"
            echo "linux_arm64=$linux_arm64"
            echo "linux_amd64=$linux_amd64"
          } >> "$GITHUB_OUTPUT"

      - name: Update selected formula
        env:
          FORMULA: ${{ inputs.formula }}
          RELEASE_VERSION: ${{ inputs.version }}
          DARWIN_ARM64: ${{ steps.checksums.outputs.darwin_arm64 }}
          DARWIN_AMD64: ${{ steps.checksums.outputs.darwin_amd64 }}
          LINUX_ARM64: ${{ steps.checksums.outputs.linux_arm64 }}
          LINUX_AMD64: ${{ steps.checksums.outputs.linux_amd64 }}
        run: |
          set -eu

          ruby scripts/update-formula.rb "$FORMULA" "$RELEASE_VERSION" \
            "$DARWIN_ARM64" "$DARWIN_AMD64" "$LINUX_ARM64" "$LINUX_AMD64"

          ruby -c "Formula/${FORMULA}.rb"
          git diff --check

          changed_files="$(git diff --name-only)"
          if [ "$changed_files" != "Formula/${FORMULA}.rb" ]; then
            echo "unexpected changed files:" >&2
            printf '%s\n' "$changed_files" >&2
            exit 1
          fi

          if git diff --quiet -- "Formula/${FORMULA}.rb"; then
            echo "Formula/${FORMULA}.rb is already current" >&2
            exit 1
          fi

      - name: Commit and push formula update
        env:
          FORMULA: ${{ inputs.formula }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Formula/${FORMULA}.rb"
          git commit -m "${FORMULA}: update to ${RELEASE_VERSION#v}"
          git push origin HEAD:main
